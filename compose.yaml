services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: appachas
      POSTGRES_PASSWORD: appachas
      POSTGRES_DB: appachas
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - appachas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appachas -d appachas"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  appachas-postgres:
