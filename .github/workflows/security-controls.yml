name: Security controls

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify GitHub Actions security controls
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_AUDIT_TOKEN || github.token }}
        run: node scripts/check-github-actions-security.mjs
